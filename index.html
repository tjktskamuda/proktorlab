<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ProktorLab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Konsol admin: sidebar kiri + tabel padat, aksen biru dongker ala konsol manajemen endpoint. */
:root {
  --bg: #f2f4f9;
  --surface: #ffffff;
  --surface-2: #f6f7fb;
  --line: #e1e5ef;
  --line-2: #cfd5e3;
  --text: #1b2033;
  --muted: #5f6880;
  --navy: #1f2d8f;
  --navy-hover: #172377;
  --navy-soft: #e3e9fb;
  --navy-text: #22339f;
  --on-navy: #ffffff;
  --ok: #17824a; --ok-soft: #e1f3e8;
  --bad: #c62828; --bad-soft: #fbe7e7;
  --warn: #a8650f; --warn-soft: #fbf0d9;
  --info: #2457d6; --info-soft: #e4ecfd;
  --idle: #8a93a8; --idle-soft: #eceef4;
  --shadow: 0 1px 2px rgba(20, 28, 70, .06), 0 4px 16px rgba(20, 28, 70, .05);
  --scrim: rgba(12, 16, 40, .45);
  --f-ui: "Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r: 6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1120; --surface: #161a2b; --surface-2: #1c2135; --line: #283049; --line-2: #343d5a;
    --text: #e4e7f1; --muted: #9aa2b9; --navy: #4f5fe6; --navy-hover: #6170ee; --navy-soft: #232a52;
    --navy-text: #a3afff; --on-navy: #ffffff;
    --ok: #46c985; --ok-soft: #12301f; --bad: #ff6f6f; --bad-soft: #3a1818; --warn: #f0b44c; --warn-soft: #3a2b10;
    --info: #79a8ff; --info-soft: #172649; --idle: #7d86a0; --idle-soft: #22283d;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3); --scrim: rgba(0, 0, 0, .6); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1120; --surface: #161a2b; --surface-2: #1c2135; --line: #283049; --line-2: #343d5a;
  --text: #e4e7f1; --muted: #9aa2b9; --navy: #4f5fe6; --navy-hover: #6170ee; --navy-soft: #232a52;
  --navy-text: #a3afff; --on-navy: #ffffff;
  --ok: #46c985; --ok-soft: #12301f; --bad: #ff6f6f; --bad-soft: #3a1818; --warn: #f0b44c; --warn-soft: #3a2b10;
  --info: #79a8ff; --info-soft: #172649; --idle: #7d86a0; --idle-soft: #22283d;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3); --scrim: rgba(0, 0, 0, .6); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--f-ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--navy-text); }
.mono { font-family: var(--f-mono); font-size: 12.5px; }
.muted { color: var(--muted); }
.ic { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.ic.sm { width: 15px; height: 15px; }
.ic.lg { width: 30px; height: 30px; }
:focus-visible { outline: 2px solid var(--navy-text); outline-offset: 2px; }
[hidden] { display: none !important; }

/* ---------- shell ---------- */
.demo-bar { background: var(--warn-soft); color: var(--text); border-bottom: 1px solid var(--line); font-size: 13px;
  padding: 7px max(16px, env(safe-area-inset-right, 0px)) 7px max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.demo-bar b { color: var(--warn); }
.demo-bar button { border: 0; background: none; color: var(--navy-text); text-decoration: underline; cursor: pointer; padding: 0; }
.shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); min-height: 100%; }
.shell.collapsed { grid-template-columns: 64px minmax(0, 1fr); }
.side { background: var(--surface); border-right: 1px solid var(--line); position: sticky; top: 0; height: 100vh; overflow-y: auto; display: flex; flex-direction: column; z-index: 30; }
.brand { display: flex; align-items: center; gap: 10px; padding: 16px 14px 14px 18px; }
.brand .logo { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--navy-text); min-width: 0; }
.brand .word { font-weight: 800; font-style: italic; font-size: 22px; letter-spacing: -.02em; white-space: nowrap; }
.brand .word span { color: var(--text); }
.brand .collapse { margin-left: auto; border: 0; background: none; color: var(--muted); cursor: pointer; padding: 4px; border-radius: 4px; display: flex; }
.brand .collapse:hover { background: var(--surface-2); }
.nav { padding: 4px 10px 16px; display: flex; flex-direction: column; gap: 1px; }
.nav .sect { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 14px 10px 6px; }
.nav button { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: none; text-align: left; padding: 8px 10px; border-radius: var(--r); cursor: pointer; color: var(--text); font-weight: 500; }
.nav button:hover { background: var(--surface-2); }
.nav button.on { background: var(--navy-soft); color: var(--navy-text); font-weight: 700; }
.nav button .lbl { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav button .cnt { font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nav .sub { display: flex; flex-direction: column; gap: 1px; margin-left: 18px; padding-left: 8px; border-left: 1px solid var(--line); }
.nav .sub button { padding: 6px 10px; font-size: 13.5px; }
.nav .chev { transition: transform .15s; }
.nav .chev.open { transform: rotate(180deg); }
.side-foot { margin-top: auto; padding: 12px 18px 18px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); display: flex; flex-direction: column; gap: 8px; }
.side-foot button { border: 0; background: none; color: var(--muted); cursor: pointer; display: flex; align-items: center; gap: 8px; padding: 0; }
.side-foot button:hover { color: var(--text); }
.shell.collapsed .brand .word, .shell.collapsed .nav .lbl, .shell.collapsed .nav .cnt, .shell.collapsed .nav .sect,
.shell.collapsed .nav .sub, .shell.collapsed .nav .chev, .shell.collapsed .side-foot span, .shell.collapsed .side-foot .ver { display: none; }
.shell.collapsed .brand { flex-direction: column; padding: 14px 8px; }
.shell.collapsed .brand .collapse { margin: 0; transform: rotate(180deg); }
.shell.collapsed .nav button { justify-content: center; }

.main { min-width: 0; display: flex; flex-direction: column; }
.top { position: sticky; top: 0; z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 12px;
  padding: 10px max(16px, env(safe-area-inset-right, 0px)) 10px max(16px, env(safe-area-inset-left, 0px)); min-height: 52px; }
.top .burger { display: none; border: 1px solid var(--line); background: var(--surface); border-radius: var(--r); padding: 6px; cursor: pointer; }
.crumbs { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; color: var(--muted); font-size: 13.5px; }
.crumbs button { border: 0; background: none; padding: 0; cursor: pointer; color: var(--text); font-weight: 600; }
.crumbs button:hover { color: var(--navy-text); text-decoration: underline; }
.crumbs .sep { color: var(--line-2); }
.crumbs .cur { color: var(--text); font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 40ch; }
.top .right { margin-left: auto; display: flex; align-items: center; gap: 12px; font-size: 13px; color: var(--muted); }
.top .clock { font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: 12.5px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.content { padding: 20px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; min-width: 0; }
@media (min-width: 1100px) { .content { padding-left: 28px; padding-right: 28px; } }
.page-h { display: flex; align-items: flex-end; gap: 12px; flex-wrap: wrap; }
.page-h h1 { font-size: 21px; margin: 0; font-weight: 700; letter-spacing: -.01em; text-wrap: balance; }
.page-h p { margin: 4px 0 0; color: var(--muted); max-width: 70ch; }
.page-h .act { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }

/* ---------- controls ---------- */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; border-radius: 4px; border: 1px solid var(--navy); background: var(--navy); color: var(--on-navy);
  font-weight: 600; font-size: 13.5px; padding: 8px 14px; cursor: pointer; white-space: nowrap; transition: background .12s, border-color .12s; text-decoration: none; }
.btn:hover:not(:disabled) { background: var(--navy-hover); border-color: var(--navy-hover); }
.btn:disabled { background: var(--idle-soft); border-color: var(--line); color: var(--idle); cursor: not-allowed; }
.btn.ghost { background: var(--surface); color: var(--text); border-color: var(--line-2); }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); border-color: var(--line-2); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.danger:hover:not(:disabled) { filter: brightness(.92); background: var(--bad); }
.btn.sm { padding: 5px 10px; font-size: 12.5px; }
.btn.big { padding: 12px 16px; font-size: 14.5px; }
.inp, select.inp, textarea.inp { width: 100%; border: 1px solid var(--line-2); background: var(--surface); border-radius: 4px; padding: 8px 10px; min-height: 36px; }
.inp:focus { outline: 2px solid var(--navy-soft); border-color: var(--navy-text); }
textarea.inp { min-height: 84px; resize: vertical; }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: 13px; font-weight: 600; }
label.f .hint { font-weight: 400; color: var(--muted); font-size: 12.5px; }
.search { position: relative; flex: 1 1 220px; max-width: 360px; }
.search .ic { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--muted); }
.search .inp { padding-left: 34px; }
.drop { position: relative; display: inline-block; }
.drop-menu { position: absolute; top: calc(100% + 4px); left: 0; min-width: 230px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); z-index: 40; padding: 4px; }
.drop-menu button { display: flex; width: 100%; gap: 9px; align-items: center; border: 0; background: none; padding: 8px 10px; border-radius: 4px; cursor: pointer; text-align: left; }
.drop-menu button:hover:not(:disabled) { background: var(--surface-2); }
.drop-menu button:disabled { color: var(--idle); cursor: not-allowed; }
.drop-menu button.red { color: var(--bad); }

/* ---------- cards ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); min-width: 0; }
.card > .hd { padding: 14px 16px 0; display: flex; align-items: center; gap: 10px; }
.card > .hd h2 { font-size: 15px; margin: 0; font-weight: 700; }
.card > .hd .sub { color: var(--muted); font-size: 12.5px; }
.card > .hd .act { margin-left: auto; }
.card > .bd { padding: 14px 16px 16px; }
.grid { display: grid; gap: 16px; }
.g-dash { grid-template-columns: repeat(12, minmax(0, 1fr)); }
.g-dash > .c4 { grid-column: span 4; } .g-dash > .c5 { grid-column: span 5; } .g-dash > .c7 { grid-column: span 7; }
.g-dash > .c6 { grid-column: span 6; } .g-dash > .c8 { grid-column: span 8; } .g-dash > .c12 { grid-column: span 12; }
@media (max-width: 1100px) { .g-dash > .c4, .g-dash > .c5, .g-dash > .c7, .g-dash > .c8 { grid-column: span 6; } }
@media (max-width: 720px) { .g-dash > * { grid-column: span 12 !important; } }
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 16px; }
.stat { display: flex; gap: 14px; align-items: center; }
.stat .ic { width: 34px; height: 34px; color: var(--navy-text); stroke-width: 1.6; }
.stat .ic.okc { color: var(--ok); } .stat .ic.badc { color: var(--bad); } .stat .ic.infoc { color: var(--info); }
.stat b { display: block; font-size: 24px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }
.gauge-wrap { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.gauge { width: 190px; max-width: 100%; }
.gauge svg { width: 100%; height: auto; display: block; }
.gauge .num { font-size: 30px; font-weight: 700; fill: var(--text); font-family: var(--f-ui); }
.gauge .cap { font-size: 12.5px; fill: var(--muted); font-family: var(--f-ui); }
.legend { display: flex; flex-direction: column; gap: 6px; font-size: 13px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.quick { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 900px) { .quick { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.qbtn { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; text-align: left; border: 1px solid var(--line-2); background: var(--surface); border-radius: var(--r); padding: 12px 12px 11px; cursor: pointer; min-width: 0; }
.qbtn:hover { border-color: var(--navy-text); background: var(--navy-soft); }
.qbtn .ic { color: var(--navy-text); width: 22px; height: 22px; }
.qbtn b { font-size: 14px; } .qbtn span { font-size: 12px; color: var(--muted); }
.qbtn.red .ic { color: var(--bad); }
.quick-hd { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
.quick-hd select { width: auto; min-width: 200px; }

/* ---------- table ---------- */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.filters select.inp { width: auto; min-width: 140px; }
.filters .count { margin-left: auto; color: var(--muted); font-size: 13px; display: flex; align-items: center; gap: 6px; }
.tbl-wrap { overflow-x: auto; border-top: 1px solid var(--line); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13.5px; }
.tbl th { position: sticky; top: 0; background: var(--surface-2); text-align: left; font-weight: 700; font-size: 12.5px; color: var(--text); padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl th.sort { cursor: pointer; user-select: none; }
.tbl th.sort:hover { color: var(--navy-text); }
.tbl td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
.tbl tbody tr:hover td { background: var(--surface-2); }
.tbl tbody tr.sel td { background: var(--navy-soft); }
.tbl tbody tr.click { cursor: pointer; }
.tbl .chk { width: 38px; padding-right: 0; }
.tbl input[type=checkbox] { width: 16px; height: 16px; accent-color: var(--navy); cursor: pointer; }
.tbl .nm { font-weight: 700; white-space: nowrap; }
.tbl .nm button { border: 0; background: none; padding: 0; font-weight: 700; color: var(--text); cursor: pointer; }
.tbl .nm button:hover { color: var(--navy-text); text-decoration: underline; }
.tbl .nowrap { white-space: nowrap; }
.tbl .user { white-space: nowrap; }
.tbl .cm { min-width: 120px; max-width: 220px; }
.tbl .msg { min-width: 220px; max-width: 420px; color: var(--muted); }
.tbl-foot { display: flex; align-items: center; gap: 12px; justify-content: flex-end; padding: 10px 16px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
.tbl-foot select { width: auto; min-height: 30px; padding: 3px 8px; }
.tbl-foot .pg { display: flex; gap: 4px; }
.empty { padding: 40px 16px; text-align: center; color: var(--muted); }
.empty .ic { width: 36px; height: 36px; color: var(--line-2); margin-bottom: 8px; }
.st { display: inline-flex; align-items: center; gap: 7px; font-weight: 600; white-space: nowrap; }
.st::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.st.on { color: var(--ok); } .st.off { color: var(--idle); }
.chip { display: inline-flex; align-items: center; gap: 5px; border-radius: 999px; padding: 2px 9px; font-size: 12px; font-weight: 700; white-space: nowrap; }
.chip.Berhasil { background: var(--ok-soft); color: var(--ok); }
.chip.Gagal { background: var(--bad-soft); color: var(--bad); }
.chip.Menunggu { background: var(--idle-soft); color: var(--muted); }
.chip.Diterima { background: var(--info-soft); color: var(--info); }
.chip.Kedaluwarsa { background: var(--warn-soft); color: var(--warn); }
.chip.Dibatalkan { background: var(--idle-soft); color: var(--idle); text-decoration: line-through; }
.chip.run { background: var(--ok-soft); color: var(--ok); }
.chip.no { background: var(--idle-soft); color: var(--muted); }
.chip.Selesai { background: var(--ok-soft); color: var(--ok); }
.chip.Berjalan { background: var(--info-soft); color: var(--info); }
.chip.Terjadwal { background: var(--warn-soft); color: var(--warn); }
.bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--idle-soft); min-width: 120px; }
.bar i { display: block; height: 100%; }
.bar .Berhasil { background: var(--ok); } .bar .Gagal { background: var(--bad); } .bar .Diterima { background: var(--info); }
.bar .Kedaluwarsa { background: var(--warn); } .bar .Dibatalkan { background: var(--idle); }
.sel-note { font-size: 13px; color: var(--navy-text); font-weight: 600; display: flex; gap: 10px; align-items: center; }
.sel-note button { border: 0; background: none; color: var(--muted); text-decoration: underline; cursor: pointer; padding: 0; font-size: 12.5px; }

/* ---------- modal / wizard ---------- */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 80; display: flex; align-items: center; justify-content: center; padding: 20px; animation: fade .15s; }
@keyframes fade { from { opacity: 0; } }
.modal { background: var(--surface); border-radius: 8px; box-shadow: 0 20px 60px rgba(0, 0, 0, .25); width: min(560px, 100%); max-height: calc(100vh - 40px); display: flex; flex-direction: column; min-width: 0; }
.modal.wide { width: min(880px, 100%); height: min(720px, calc(100vh - 40px)); }
.modal .mh { display: flex; align-items: center; gap: 10px; padding: 16px 20px; border-bottom: 1px solid var(--line); }
.modal .mh h3 { margin: 0; font-size: 17px; }
.modal .mh .x { margin-left: auto; border: 0; background: none; cursor: pointer; color: var(--muted); padding: 4px; border-radius: 4px; display: flex; }
.modal .mh .x:hover { background: var(--surface-2); }
.modal .mb { padding: 18px 20px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 14px; min-height: 0; }
.modal .mf { display: flex; gap: 8px; padding: 14px 20px; border-top: 1px solid var(--line); align-items: center; flex-wrap: wrap; }
.modal .mf .sp { flex: 1; }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; padding: 14px 20px 0; }
.steps .s { display: flex; align-items: baseline; gap: 8px; padding-bottom: 10px; border-bottom: 3px solid var(--line); color: var(--muted); font-weight: 600; font-size: 13.5px; min-width: 0; }
.steps .s b { font-size: 22px; font-weight: 600; color: var(--line-2); }
.steps .s.on { border-color: var(--navy); color: var(--text); } .steps .s.on b { color: var(--navy-text); }
.steps .s.done { border-color: var(--navy); } .steps .s.done b { color: var(--navy-text); }
.steps .s span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.slist { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.sitem { display: flex; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: flex-start; }
.sitem:last-child { border-bottom: 0; }
.sitem:hover { background: var(--surface-2); }
.sitem.on { background: var(--navy-soft); }
.sitem input { margin-top: 3px; accent-color: var(--navy); width: 16px; height: 16px; flex: none; }
.sitem .t { font-weight: 700; } .sitem .d { color: var(--muted); font-size: 12.8px; margin-top: 2px; }
.sitem .t small { font-weight: 500; color: var(--muted); margin-left: 6px; }
.eplist { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.epi { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 4px; padding: 7px 9px; cursor: pointer; font-size: 13px; min-width: 0; }
.epi:hover { border-color: var(--line-2); background: var(--surface-2); }
.epi.on { border-color: var(--navy-text); background: var(--navy-soft); }
.epi input { accent-color: var(--navy); }
.epi .n { font-weight: 700; } .epi .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--idle); margin-left: auto; flex: none; }

/* Alamat backend (URL Aplikasi Web Apps Script .../exec). Urutan: ?api= di alamat,
   lalu yang tersimpan di browser ini, lalu config.js. */
var CFG = window.PROKTORLAB_CONFIG || {};
var QS = new URLSearchParams(location.search);
if (QS.get('api')) lsSet('pl_api', QS.get('api').trim());
var API = String(QS.get('api') || lsGet('pl_api', '') || CFG.apiUrl || '').trim();
var IS_LIVE = false;
var S = {
  token: null, offset: 0, settings: null, groups: [], endpoints: [], layar: null, url: '', key: '', installUrl: '', version: '',
  view: { name: 'dash' }, navOpen: false, collapsed: lsGet('pl_collapsed', false), epOpen: true,
  sel: {}, sort: { key: 'name', dir: 1 }, filt: { q: '', st: '', ex: '', os: '' }, page: 1, pageSize: lsGet('pl_pagesize', 200),
  jobs: [], job: null, quickGroup: lsGet('pl_quick_group', '')
};

function call(action, data) {
  if (!IS_LIVE) return Demo.call(action, data);
  // body berupa teks biasa -> "simple request" tanpa preflight CORS, cocok untuk Apps Script
  return fetch(API, { method: 'POST', redirect: 'follow', body: JSON.stringify({ action: action, data: data || {}, token: S.token }) })
    .then(function (r) { return r.text(); }, function () {
      throw new Error('Tidak bisa menghubungi backend. Periksa internet, URL Apps Script, dan akses deployment "Siapa saja".');
    })
    .then(function (t) {
      var j;
      try { j = JSON.parse(t); } catch (e) { throw new Error('Jawaban backend tidak valid. Pastikan URL berakhiran /exec dan deployment diatur "Siapa saja".'); }
      if (!j.ok) {
        if (j.error === 'AUTH') {
          if (action !== 'logout') showLogin();
          throw new Error('Sesi berakhir, silakan masuk lagi.');
        }
        throw new Error(j.error || 'Terjadi kesalahan di backend.');
      }
      return j.data;
    });
}
function apiGet(url, params) {
  var q = Object.keys(params).map(function (k) { return k + '=' + encodeURIComponent(params[k]); }).join('&');
  return fetch(url + (url.indexOf('?') < 0 ? '?' : '&') + q, { redirect: 'follow' }).then(function (r) { return r.json(); });
}
function act(action, data, okMsg) {
  return call(action, data).then(function (r) { if (okMsg) toast(okMsg); return r; }, function (e) { toast(e.message, true); throw e; });
}

var Demo = (function () {

      settings: { school: 'SMKN 1 Murung Pudak', tz: 'Asia/Makassar', interval: 10, examPreset: 'seb',
        examPath: PRESETS.seb.path, examArgs: '', examProc: PRESETS.seb.proc, groups: [NEW_GROUP, 'Lab TJKT 1', 'Lab TJKT 2', 'Ruang Proktor'], defaultGroup: NEW_GROUP },
      eps: eps, jobs: [], rows: {}, layar: lay, key: DEMO_KEY
    };
    // contoh riwayat

    j1.created = t - 3600000 * 3;
    persistLayar();
  }
  function ep(id) { for (var i = 0; i < st.eps.length; i++) if (st.eps[i].id === id) return st.eps[i]; return null; }
  function groups() {
    var set = {};
    st.settings.groups.forEach(function (g) { set[g] = 1; });
    set[NEW_GROUP] = 1;
    st.eps.forEach(function (e) { set[e.group] = 1; });
    return Object.keys(set).sort(function (a, b) { return a === NEW_GROUP ? -1 : b === NEW_GROUP ? 1 : natCmp(a, b); });
  }
  function persistLayar() { lsSet('pl_demo_layar', Object.assign({ tz: st.settings.tz }, st.layar)); }
  function mkJob(action, targets, at, winMin, params) {
    var id = 'J' + Date.now().toString(36).toUpperCase() + Math.floor(Math.random() * 90 + 10);
    var dl = Math.max(at, Date.now()) + winMin * 60000;
    var job = { id: id, script: SCRIPT[action].name, action: action, params: params || {}, total: targets.length, at: at, dl: dl, created: Date.now(), status: 'Aktif' };
    st.jobs.unshift(job);
    st.rows[id] = targets.map(function (t) { return { ep: t, status: 'Menunggu', msg: at > Date.now() + 5000 ? 'Dijadwalkan.' : 'Menunggu endpoint melapor...', t: Date.now() }; });
    return job;
  }
  function setRow(job, epId, status, msg) {
    var rows = st.rows[job.id] || [];
    rows.forEach(function (r) { if (r.ep === epId && (PENDING.indexOf(r.status) >= 0 || status === 'Berhasil')) { r.status = status; r.msg = msg; r.t = Date.now(); } });
  }
  function execute(job, epId) {
    var e = ep(epId);
    if (!e || job.status === 'Dibatalkan') return;
    var row = (st.rows[job.id] || []).filter(function (r) { return r.ep === epId; })[0];
    if (!row || PENDING.indexOf(row.status) < 0) return;
    if (!e.online) return;
    if (Date.now() > job.dl) { setRow(job, epId, 'Kedaluwarsa', 'Melewati batas waktu penyelesaian.'); return; }
    var user = e.loggedIn ? e.user : '';
    var noUser = 'Tidak ada pengguna yang sedang login di komputer ini.';
    switch (job.action) {
      case 'run_exam':
        if (!user) return setRow(job, epId, 'Gagal', noUser);
        if (e.exam) return setRow(job, epId, 'Berhasil', 'Exam Browser sudah berjalan.');
        e.exam = true; return setRow(job, epId, 'Berhasil', 'Exam Browser dibuka untuk ' + user + '.');
      case 'close_exam':
        if (!e.exam) return setRow(job, epId, 'Berhasil', 'Tidak ada Exam Browser yang berjalan.');
        e.exam = false; return setRow(job, epId, 'Berhasil', 'Exam Browser ditutup (2 proses).');
      case 'shutdown':
        setRow(job, epId, 'Berhasil', 'Komputer dimatikan.');
        setTimeout(function () { e.online = false; e.exam = false; e.seen = Date.now(); }, 1500); return;
      case 'restart':
        setRow(job, epId, 'Berhasil', 'Komputer dimulai ulang.');
        setTimeout(function () { e.online = false; e.exam = false; }, 1500);
        setTimeout(function () { e.online = true; e.seen = Date.now(); pump(); }, 14000 + Math.random() * 6000); return;
      case 'logoff':
        if (!user) return setRow(job, epId, 'Gagal', noUser);
        e.exam = false; e.loggedIn = false; setRow(job, epId, 'Berhasil', 'Log off dikirim ke ' + user + '.');
        setTimeout(function () { e.loggedIn = true; }, 20000); return;
      case 'lock':
        if (!user) return setRow(job, epId, 'Gagal', noUser);
        return setRow(job, epId, 'Berhasil', 'Layar dikunci (' + user + ').');
      case 'message':
        if (!user) return setRow(job, epId, 'Gagal', noUser);
        return setRow(job, epId, 'Berhasil', 'Pesan ditampilkan ke ' + user + '.');
      case 'open_url':
        if (!user) return setRow(job, epId, 'Gagal', noUser);
        return setRow(job, epId, 'Berhasil', 'Situs dibuka untuk ' + user + '.');
      case 'update_agent':
        e.ver = '1.0.0'; return setRow(job, epId, 'Berhasil', 'Agen diperbarui, memulai ulang agen...');
    }
  }
  function pump() {
    var t = Date.now();
    st.jobs.forEach(function (job) {
      if (job.status === 'Dibatalkan' || job.action === 'wol') return;
      (st.rows[job.id] || []).forEach(function (r) {
        if (PENDING.indexOf(r.status) < 0) return;
        var e = ep(r.ep);
        if (!e || !e.online || t > job.dl) return;
        if (r._q) return;
        if (job.at > t) {
          if (r.status === 'Menunggu') { r.status = 'Diterima'; r.msg = 'Diterima, menunggu waktu jadwal.'; r.t = t; }
          return;
        }
        r._q = 1;
        setTimeout(function () {
          if (r.status === 'Menunggu') { r.status = 'Diterima'; r.msg = 'Sedang dijalankan...'; r.t = Date.now(); }
          setTimeout(function () { r._q = 0; execute(job, r.ep); }, 400 + Math.random() * 1600);
        }, 300 + Math.random() * 1500);
      });
    });
  }
  setInterval(function () {
    if (!st) return;
    st.eps.forEach(function (e) { if (e.online) e.seen = Date.now() - Math.random() * 6000; });
    pump();
  }, 1000);
  function wol(job, targets) {
    var relay = st.eps.filter(function (e) { return e.online && targets.indexOf(e.id) < 0; })
      .sort(function (a) { return a.group === 'Ruang Proktor' ? -1 : 1; })[0];
    if (!relay) {
      targets.forEach(function (t) { setRow(job, t, 'Gagal', 'Tidak ada komputer lain yang online untuk mengirim sinyal Wake on LAN.'); });
      return;
    }
    (st.rows[job.id] || []).forEach(function (r) { r.msg = 'Menunggu dikirim lewat ' + relay.id + '...'; });
    var go = function () {
      if (job.status === 'Dibatalkan') return;
      targets.forEach(function (t) {
        setRow(job, t, 'Berhasil', 'Magic packet dikirim oleh ' + relay.id + ' ke ' + targets.length + ' komputer.');
        var e = ep(t);
        if (e && !e.online) setTimeout(function () { e.online = true; e.loggedIn = true; e.seen = Date.now(); pump(); }, 7000 + Math.random() * 9000);
      });
    };
    setTimeout(go, Math.max(0, job.at - Date.now()) + 1200);
  }
  var H = {
    status: function () { return { hasPassword: true, version: '1.0.0', school: st.settings.school }; },
    login: function () { return { token: 'demo' }; },
    setup: function () { return { token: 'demo' }; },
    boot: function () {
      return { version: '1.0.0', settings: st.settings, groups: groups(), endpoints: H.endpoints().endpoints, layar: st.layar,
        url: 'https://script.google.com/macros/s/AKfycbx-CONTOH-URL-WEB-APP/exec', key: st.key,
        installUrl: 'https://script.google.com/macros/s/AKfycbx-CONTOH-URL-WEB-APP/exec?f=install&k=' + st.key, now: Date.now() };
    },
    endpoints: function () { return { endpoints: st.eps.map(function (e) { return Object.assign({}, e, { user: e.loggedIn || !e.online ? e.user : '' }); }), now: Date.now() }; },
    createJob: function (d) {
      var targets = (d.targets || []).filter(function (t) { return ep(t); });
      if (!targets.length) throw new Error('Pilih minimal satu endpoint.');
      if (d.action === 'message' && !(d.params && String(d.params.text || '').trim())) throw new Error('Isi pesan wajib diisi.');
      if (d.action === 'open_url' && !/^https?:\/\//i.test((d.params && d.params.url) || '')) throw new Error('URL harus diawali http:// atau https://');
      var at = Number(d.runAt) > 0 ? Number(d.runAt) : Date.now();
      if (at < Date.now() - 120000) throw new Error('Waktu jadwal sudah lewat.');
      var job = mkJob(d.action, targets, at, Number(d.windowMin) || 60, d.params || {});
      if (d.action === 'wol') wol(job, targets); else pump();
      return { id: job.id };
    },
    jobs: function () {
      return { jobs: st.jobs.map(function (j) {
        var c = {};
        (st.rows[j.id] || []).forEach(function (r) { c[r.status] = (c[r.status] || 0) + 1; });
        return Object.assign({}, j, { counts: c });
      }), now: Date.now() };
    },
    job: function (d) {
      var j = st.jobs.filter(function (x) { return x.id === d.id; })[0];
      if (!j) throw new Error('Otomasi tidak ditemukan.');
      var c = {};
      var rows = (st.rows[j.id] || []).map(function (r) {
        c[r.status] = (c[r.status] || 0) + 1;
        var e = ep(r.ep);
        return { ep: r.ep, status: r.status, msg: r.msg, t: r.t, group: e ? e.group : '-', online: !!(e && e.online) };
      });
      return { job: Object.assign({}, j, { counts: c }), rows: rows, now: Date.now() };
    },
    cancelJob: function (d) {
      var j = st.jobs.filter(function (x) { return x.id === d.id; })[0];
      if (j) { j.status = 'Dibatalkan'; (st.rows[j.id] || []).forEach(function (r) { if (PENDING.indexOf(r.status) >= 0) { r.status = 'Dibatalkan'; r.msg = 'Dibatalkan oleh proktor.'; r.t = Date.now(); } }); }
      return { ok: true };
    },
    clearHistory: function () { st.jobs = []; st.rows = {}; return { ok: true }; },
    saveSettings: function (d) {
      ['school', 'tz', 'examPreset', 'examPath', 'examArgs', 'examProc', 'defaultGroup'].forEach(function (k) { if (d[k] != null) st.settings[k] = String(d[k]); });

      persistLayar();
      return { settings: st.settings };
    },
    saveLayar: function (d) {
      ['label', 'school', 'sub', 'sesi', 'token'].forEach(function (k) { if (d[k] != null) st.layar[k] = String(d[k]); });
      if (d.start != null) st.layar.start = Number(d.start) || 0;
      if (d.end != null) st.layar.end = Number(d.end) || 0;
      persistLayar();
      return { layar: st.layar };
    },
    moveEndpoints: function (d) {
      (d.ids || []).forEach(function (id) { var e = ep(id); if (e) e.group = d.group; });
      if (st.settings.groups.indexOf(d.group) < 0) st.settings.groups.push(d.group);
      return { ok: true };
    },
    setComment: function (d) { var e = ep(d.id); if (e) e.comment = String(d.comment || ''); return { ok: true }; },
    deleteEndpoints: function (d) { st.eps = st.eps.filter(function (e) { return (d.ids || []).indexOf(e.id) < 0; }); return { ok: true }; },
    createGroup: function (d) {
      var n = String(d.name || '').trim();
      if (!n) throw new Error('Nama grup kosong.');
      if (st.settings.groups.indexOf(n) < 0) st.settings.groups.push(n);
      return { groups: groups() };
    },
    renameGroup: function (d) {

      if (d.from === NEW_GROUP) throw new Error('Grup "' + NEW_GROUP + '" tidak bisa diganti namanya.');
      st.eps.forEach(function (e) { if (e.group === d.from) e.group = to; });
      st.settings.groups = st.settings.groups.map(function (g) { return g === d.from ? to : g; });
      if (st.settings.groups.indexOf(to) < 0) st.settings.groups.push(to);
      return { groups: groups() };
    },
    deleteGroup: function (d) {
      if (d.name === NEW_GROUP) throw new Error('Grup "' + NEW_GROUP + '" tidak bisa dihapus.');
      st.eps.forEach(function (e) { if (e.group === d.name) e.group = NEW_GROUP; });
      st.settings.groups = st.settings.groups.filter(function (g) { return g !== d.name; });
      return { groups: groups() };
    },
    regenKey: function () {
      st.key = 'demo' + Math.random().toString(16).slice(2) + Math.random().toString(16).slice(2);
      return { key: st.key, installUrl: 'https://script.google.com/macros/s/AKfycbx-CONTOH-URL-WEB-APP/exec?f=install&k=' + st.key };

    },
    logout: function () { return { ok: true }; }
  };
  return {
    call: function (action, data) {
      if (!st) seed();
      return new Promise(function (resolve, reject) {

          try {
            if (!H[action]) throw new Error('Aksi tidak dikenal: ' + action);
            var r = H[action](data || {});
            Promise.resolve(r).then(function (v) { resolve(JSON.parse(JSON.stringify(v))); }, reject);
          } catch (e) { reject(e); }
        }, 120 + Math.random() * 180);
      });
    }
  };
})();

/* =============================== LOGIN =============================== */
function showLogin() {
  stopPolling();
  S.token = null;
  lsDel('pl_token');
  closeLayer();
  call('status').then(function (st) {
    var first = !st.hasPassword;
    $('#root').innerHTML =
      '<div class="login"><form class="card" id="login-form" autocomplete="on">' +
      '<div><div class="word">Proktor<span>Lab</span></div><div class="muted">' + esc(st.school || 'Panel Proktor') + '</div></div>' +
      '<div><h2 style="margin:0 0 4px;font-size:18px">' + (first ? 'Buat kata sandi admin' : 'Masuk ke Panel Proktor') + '</h2>' +
      '<div class="muted" style="font-size:13px">' + (first ? 'Ini pertama kali panel dibuka. Kata sandi ini dipakai semua proktor untuk masuk.' : 'Masukkan kata sandi admin.') + '</div></div>' +
      '<label class="f">Kata sandi<input class="inp" type="password" id="lg-pw" autocomplete="' + (first ? 'new-password' : 'current-password') + '" required minlength="' + (first ? 6 : 1) + '"></label>' +
      (first ? '<label class="f">Ulangi kata sandi<input class="inp" type="password" id="lg-pw2" autocomplete="new-password" required></label>' : '') +
      '<div class="err-text" id="lg-err"></div>' +
      '<button class="btn big" type="submit" id="lg-btn">' + (first ? 'Simpan & masuk' : 'Masuk') + '</button></form></div>';
    $('#lg-pw').focus();
    $('#login-form').addEventListener('submit', function (e) {
      e.preventDefault();
      var pw = $('#lg-pw').value;
      if (first && pw !== $('#lg-pw2').value) { $('#lg-err').textContent = 'Kedua kata sandi tidak sama.'; return; }
      if (first && pw.length < 6) { $('#lg-err').textContent = 'Kata sandi minimal 6 karakter.'; return; }
      $('#lg-btn').disabled = true;
      $('#lg-err').textContent = '';
      call(first ? 'setup' : 'login', { password: pw }).then(function (r) {
        S.token = r.token; lsSet('pl_token', r.token); boot();
      }, function (err) {
        $('#lg-btn').disabled = false; $('#lg-err').textContent = err.message;
      });
    });
  }, function (e) {
    $('#root').innerHTML = '<div class="login"><div class="card"><b>Gagal terhubung ke backend.</b><div class="muted">' + esc(e.message) + '</div>' +
      '<div class="mono muted" style="overflow-wrap:anywhere">' + esc(API) + '</div>' +
      '<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="lg-retry">Coba lagi</button><button class="btn ghost" data-act="connect">Ganti URL backend</button></div></div></div>';
    $('#lg-retry').onclick = showLogin;
  });
}

/* =============================== HUBUNGKAN BACKEND =============================== */
function showConnect(msg) {
  stopPolling();
  closeLayer();
  $('#root').innerHTML =
    '<div class="login"><form class="card" id="cn-form" style="width:min(480px,100%)">' +
    '<div><div class="word">Proktor<span>Lab</span></div><div class="muted">Panel proktor lab komputer</div></div>' +
    '<div><h2 style="margin:0 0 4px;font-size:18px">Hubungkan ke backend</h2>' +
    '<div class="muted" style="font-size:13px">Tempel URL Aplikasi Web Google Apps Script milik sekolah (berakhiran <span class="mono">/exec</span>). Cukup sekali per perangkat.</div></div>' +
    '<label class="f">URL backend<input class="inp mono" id="cn-url" inputmode="url" autocomplete="url" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(API) + '"></label>' +
    '<div class="err-text" id="cn-err">' + esc(msg || '') + '</div>' +
    '<button class="btn big" type="submit" id="cn-btn">Hubungkan</button>' +
    '<div style="display:flex;gap:12px;justify-content:space-between;flex-wrap:wrap;font-size:13.5px">' +
    '<button type="button" class="link-btn" id="cn-demo">Coba mode demo</button>' +
    '<button type="button" class="link-btn" id="cn-guide">Panduan pemasangan & kode</button></div></form></div>';
  $('#cn-url').focus();
  $('#cn-demo').onclick = function () { startDemo(); };
  $('#cn-guide').onclick = function () { startDemo('guide'); };
  $('#cn-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var url = $('#cn-url').value.trim();
    if (!/^https?:\/\/\S+\/exec$/.test(url)) { $('#cn-err').textContent = 'URL harus lengkap dan berakhiran /exec (bukan /dev).'; return; }
    $('#cn-btn').disabled = true;
    $('#cn-err').textContent = '';
    apiGet(url, { action: 'ping' }).then(function (j) {
      if (!j || !j.ok || !j.data || j.data.app !== 'ProktorLab') throw new Error('x');
      API = url;
      lsSet('pl_api', url);
      lsDel('pl_token');
      startLive();
    }).catch(function () {
      $('#cn-btn').disabled = false;
      $('#cn-err').textContent = 'Backend tidak menjawab. Cek URL, pastikan sudah di-Terapkan sebagai Aplikasi web dengan akses "Siapa saja".';

/* =============================== POLLING =============================== */
var timers = {};
function startPolling() {
  stopPolling();
  timers.clock = setInterval(function () { tickClock(); var v = VIEWS[S.view.name]; if (v && v.tick) v.tick(); }, 1000);
  timers.ep = setInterval(function () {
    if (document.hidden) return;
    if (['dash', 'eps', 'layar'].indexOf(S.view.name) < 0 && !$('.modal')) return;
    refreshEndpoints();
  }, IS_LIVE ? 5000 : 2000);
  timers.job = setInterval(function () {
    if (document.hidden) return;
    var v = VIEWS[S.view.name];
    if (v && v.poll) v.poll();
  }, IS_LIVE ? 3500 : 1500);
}
function stopPolling() { Object.keys(timers).forEach(function (k) { clearInterval(timers[k]); }); timers = {}; }
var epBusy = false;
function refreshEndpoints() {
  if (epBusy) return Promise.resolve();
  epBusy = true;
  return call('endpoints').then(function (r) {
    epBusy = false;
    S.offset = r.now - Date.now();
    S.endpoints = r.endpoints;
    var newGroup = false;
    S.endpoints.forEach(function (e) { if (S.groups.indexOf(e.group) < 0) { S.groups.push(e.group); newGroup = true; } });
    if (newGroup) {
      S.groups.sort(function (a, b) { return a === NEW_GROUP ? -1 : b === NEW_GROUP ? 1 : natCmp(a, b); });
      renderSide();
    }
    var pill = $('#online-pill');
    if (pill) pill.textContent = S.endpoints.filter(function (e) { return e.online; }).length + '/' + S.endpoints.length + ' online';
    $$('.nav .sub .cnt').forEach(function (el) {
      var b = el.parentNode; var g = b.getAttribute('data-group');
      el.textContent = epCount(g || null);
    });
    if (ptrDown) { deferred = true; return; }
    applyEndpointUpdate();
  }, function () { epBusy = false; });
}
function applyEndpointUpdate() {
  var v = VIEWS[S.view.name];
  if (v && v.update) v.update();
  if (Wizard.open) Wizard.refreshEps();
}

document.addEventListener('pointerdown', function () { ptrDown = true; }, true);

function runQuick(action, ids, label) {
  var sc = SCRIPT[action];
  if (sc.params) { Wizard.start({ action: action, targets: ids, jump: true }); return Promise.resolve(); }
  var eps = S.endpoints.filter(function (e) { return ids.indexOf(e.id) >= 0; });
  var online = eps.filter(function (e) { return e.online; }).length;
  var note = action === 'wol'
    ? '<div class="box info">' + (eps.length - online) + ' dari ' + eps.length + ' komputer sedang mati/offline dan akan dinyalakan. Sinyal dikirim oleh komputer lain yang online.</div>'
    : (online < eps.length ? '<div class="box warn">' + (eps.length - online) + ' komputer sedang offline. Perintah akan dijalankan begitu komputer itu online (maks. ' + sc.win + ' menit).</div>' : '');
  var danger = ['shutdown', 'restart', 'logoff'].indexOf(action) >= 0;
  return confirmBox(sc.name, '<div>Jalankan <b>' + esc(sc.name) + '</b> sekarang di <b>' + eps.length + ' endpoint</b>' + (label ? ' (' + esc(label) + ')' : '') + '?</div>' + note +
    '<div class="muted" style="font-size:13px">' + esc(sc.desc) + '</div>', 'Jalankan sekarang', danger).then(function (ok) {
    if (!ok) return;
    return act('createJob', { action: action, targets: ids, windowMin: sc.win }, sc.name + ' dikirim ke ' + ids.length + ' endpoint.').then(function (r) {
      go('job', { id: r.id });
    });
  });
}

function gauge(val, total, cOn, cOff, cap, legend) {

    '<path d="' + arc + '" fill="none" stroke="' + (total ? cOff : 'var(--idle-soft)') + '" stroke-width="20"/>' +

VIEWS.job = {
  mount: function (el) {
    S.job = null;
    el.innerHTML = '<div class="loading"><span class="spin"></span> Memuat detail…</div>';
    this.poll(true);
  },
  poll: function (first) {
    var id = S.view.id;
    // setelah selesai, tetap segarkan pelan-pelan (kolom Koneksi, mis. setelah Wake on LAN)
    if (!first && S.job && jobState(S.job.job) === 'Selesai' && !VIEWS.job._again && (VIEWS.job._n = (VIEWS.job._n || 0) + 1) % 4) return;
    if (VIEWS.job._busy) return;
    VIEWS.job._busy = true;
    VIEWS.job._again = false;
    call('job', { id: id }).then(function (r) {
      VIEWS.job._busy = false;
      if (S.view.name !== 'job' || S.view.id !== id) return;
      var firstLoad = !S.job;
      S.job = r;
      if (firstLoad) renderTop();
      VIEWS.job.render();
    }, function (e) {
      VIEWS.job._busy = false;
      if (first) $('#view').innerHTML = '<div class="empty">' + esc(e.message) + '</div>';
    });
  },
  render: function () {
    var r = S.job, j = r.job;

    var c = {};
    rows.forEach(function (x) { c[x.status] = (c[x.status] || 0) + 1; });
    var stt = jobState(j);
    var pend = (c.Menunggu || 0) + (c.Diterima || 0);
    var failed = rows.filter(function (x) { return x.status === 'Gagal' || x.status === 'Kedaluwarsa'; }).map(function (x) { return x.ep; });
    var sc = SCRIPT[j.action] || {};

    $('#view').innerHTML =
      '<div class="page-h"><div><h1>' + esc(j.script) + (sc.sub ? ' <span class="muted" style="font-weight:500;font-size:15px">' + esc(sc.sub) + '</span>' : '') + '</h1>' +
      '<p>' + esc(sc.desc || '') + '</p></div><div class="act">' +
      (pend && stt !== 'Dibatalkan' ? '<button class="btn ghost" data-act="cancel-job">' + icon('x', 'sm') + 'Batalkan yang belum jalan</button>' : '') +

      '<section class="card"><div class="bd" style="display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:20px">' +

      '<dt>Dijadwalkan</dt><dd>' + esc(fDT(j.at)) + ' ' + tzInfo().label + (j.at > now() ? ' <span class="muted">(' + esc(dur(j.at - now())) + 'lagi)</span>' : '') + '</dd>' +
      '<dt>Batas waktu</dt><dd>' + esc(fDT(j.dl)) + ' ' + tzInfo().label + '</dd>' + params + '<dt>Dibuat</dt><dd>' + esc(fDT(j.created)) + '</dd></dl>' +
      '<div style="display:flex;flex-direction:column;gap:12px;min-width:0"><div style="display:flex;align-items:baseline;gap:10px"><span style="font-size:30px;font-weight:800">' + (c.Berhasil || 0) + '<span class="muted" style="font-size:18px;font-weight:600">/' + j.total + '</span></span><span class="muted">endpoint berhasil</span></div>' +
      barHtml(c, j.total) +

      '<section class="card"><div class="tbl-wrap" style="border-top:0"><table class="tbl"><thead><tr><th>Endpoint</th><th>Tipe</th><th>Grup</th><th>Koneksi</th><th>Status</th><th>Keterangan</th><th>Diperbarui</th></tr></thead><tbody>' +

/* Isi file .bat dibuat langsung di browser (tidak lewat server Google) supaya
   tidak terhalang aturan unduhan. Sama dengan buildBat_() di Code.gs. */
function buildBat(installUrl) {
  var u = installUrl.replace(/%/g, '%%');
  return [
    '@echo off',
    'title Pasang Agen ProktorLab',
    'net session >nul 2>&1',
    'if %errorlevel% neq 0 (',
    '  echo Meminta hak Administrator...',
    '  powershell -NoProfile -Command "Start-Process -FilePath \'%~f0\' -Verb RunAs"',
    '  exit /b',
    ')',
    'powershell -NoProfile -ExecutionPolicy Bypass -Command "[Net.ServicePointManager]::SecurityProtocol=3072; irm \'' + u + '\' -UseBasicParsing | iex"',
    'echo.',
    'pause',
    ''
  ].join('\r\n');
}
function downloadText(text, name) {
  var blob = new Blob([text], { type: 'application/octet-stream' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}

      if (m) m.textContent = t.split('\n').length + ' baris · ' + Math.round(t.length / 1024) + ' KB';
      var b = $('[data-file="' + f.name + '"]');
      if (b) b.disabled = false;
    }, function () {
      var m = $('[data-meta="' + f.name + '"]');
      if (m) m.textContent = 'Gagal memuat. Muat ulang halaman.';
    });
  });
}

  render: function () {

        return '<label class="sitem' + (d.action === s.id ? ' on' : '') + '"><input type="radio" name="wz-s" value="' + s.id + '"' + (d.action === s.id ? ' checked' : '') + '>' +
          '<div><div class="t">' + esc(s.name) + (s.sub ? '<small>' + esc(s.sub) + '</small>' : '') + '</div><div class="d">' + esc(s.desc) + '</div></div></label>';

  params: function () {

      var v = esc(d.params[p.key] || '');

        ? '<textarea class="inp" data-p="' + p.key + '" maxlength="500" placeholder="' + esc(p.ph) + '">' + v + '</textarea>'

  },
  renderFootOnly: function () {
    var d = this.d, n = Object.keys(d.sel).length;
    var m = $('#wz-foot .muted');
    if (m) m.textContent = (d.action ? SCRIPT[d.action].name : 'Belum memilih skrip') + ' · ' + n + ' endpoint';
  },
  step2: function (el) {
    var d = this.d;
    el.innerHTML = '<div><b>Pilih endpoint</b><div class="muted" style="font-size:13px">' + (d.action === 'wol' ? 'Pilih komputer yang ingin dinyalakan (biasanya yang berstatus mati).' : 'Endpoint yang offline akan menjalankan skrip begitu online, selama masih dalam batas waktu.') + '</div></div>' +
      '<div class="filters"><select class="inp" id="wz-g" aria-label="Grup"><option value="">Semua grup</option>' + S.groups.map(function (g) { return '<option' + (d.group === g ? ' selected' : '') + '>' + esc(g) + '</option>'; }).join('') + '</select>' +
      '<div class="search">' + icon('search', 'sm') + '<input class="inp" id="wz-eq" placeholder="Cari nama…"></div>' +
      '<button class="btn ghost sm" data-act="wz-all">Pilih semua yang tampil</button><button class="btn ghost sm" data-act="wz-none">Kosongkan</button>' +
      (d.action === 'wol' ? '<button class="btn ghost sm" data-act="wz-off">Pilih yang mati</button>' : '<button class="btn ghost sm" data-act="wz-on">Pilih yang online</button>') +
      '<span class="count" id="wz-count"></span></div><div class="eplist" id="wz-eps"></div>';
    $('#wz-g').addEventListener('change', function () { d.group = this.value; Wizard.refreshEps(); });
    $('#wz-eq').addEventListener('input', function () { Wizard.refreshEps(); });

  },
  epFiltered: function () {
    var d = this.d, q = ($('#wz-eq') ? $('#wz-eq').value : '').toLowerCase();
    return S.endpoints.filter(function (e) { return (!d.group || e.group === d.group) && (!q || e.name.toLowerCase().indexOf(q) >= 0); })
      .sort(function (a, b) { return natCmp(a.name, b.name); });
  },
  refreshEps: function () {
    var el = $('#wz-eps');
    if (!el || this.d.step !== 2) return;
    var d = this.d;
    var list = this.epFiltered();
    el.innerHTML = list.map(function (e) {
      var on = !!d.sel[e.id];
      return '<label class="epi' + (on ? ' on' : '') + '"><input type="checkbox" data-id="' + esc(e.id) + '"' + (on ? ' checked' : '') + '><span class="n">' + esc(e.name) + '</span>' +
        (e.exam ? '<span class="chip run" style="padding:0 6px;font-size:10.5px">EB</span>' : '') + '<span class="dot' + (e.online ? ' on' : '') + '" title="' + (e.online ? 'Online' : 'Offline') + '"></span></label>';
    }).join('') || '<div class="muted">Tidak ada endpoint.</div>';
    $$('input', el).forEach(function (c) {
      c.addEventListener('change', function () {
        var id = this.getAttribute('data-id');
        if (this.checked) d.sel[id] = 1; else delete d.sel[id];
        this.parentNode.classList.toggle('on', this.checked);
        Wizard.counts();
      });
    });
    this.counts();
  },
  counts: function () {
    var d = this.d, ids = Object.keys(d.sel);
    var on = S.endpoints.filter(function (e) { return d.sel[e.id] && e.online; }).length;
    var c = $('#wz-count');
    if (c) c.textContent = ids.length + ' dipilih · ' + on + ' online';
    this.renderFootOnly();
  },
  step3: function (el) {
    var d = this.d, sc = SCRIPT[d.action], tz = tzInfo().label;
    el.innerHTML = '<div><b>Kapan otomasi ini dijalankan?</b></div><div class="sched">' +
      '<label class="radio"><input type="radio" name="wz-when" value="now"' + (d.when === 'now' ? ' checked' : '') + '><div><b>Sekarang</b><div class="muted" style="font-size:13px">Dijalankan begitu tiap endpoint melapor (±' + S.settings.interval + ' detik).</div></div></label>' +
      '<label class="radio"><input type="radio" name="wz-when" value="at"' + (d.when === 'at' ? ' checked' : '') + '><div><b>Pada waktu tertentu</b><div class="muted" style="font-size:13px">Semua endpoint menjalankan tepat pada jam yang sama.</div></div></label>' +
      '<div class="row"><input class="inp" type="date" id="wz-date" value="' + d.date + '"><input class="inp" type="time" id="wz-time" value="' + d.time + '"><span class="muted">' + tz + '</span></div></div>' +
      '<div class="h-sec">Jendela penjadwalan ulang</div>' +
      '<div class="sched"><div class="row" style="padding-left:0">Batas waktu penyelesaian <input class="inp" type="number" min="1" max="999" id="wz-win" value="' + d.win + '" style="width:80px">' +
      '<select class="inp" id="wz-unit"><option' + (d.unit === 'menit' ? ' selected' : '') + '>menit</option><option' + (d.unit === 'jam' ? ' selected' : '') + '>jam</option></select> setelah waktu mulai.</div>' +
      '<div class="muted" style="font-size:13px">Endpoint yang mati atau offline tetap menjalankan skrip begitu online lagi, selama masih dalam batas waktu ini. Setelah itu statusnya menjadi Kedaluwarsa.</div></div>' +
      '<div class="box info" id="wz-sum"></div>';
    var self = this;
    var upd = function () {
      d.when = $('[name=wz-when]:checked').value; d.date = $('#wz-date').value; d.time = $('#wz-time').value;
      d.win = Number($('#wz-win').value) || 1; d.unit = $('#wz-unit').value;
      $('#wz-date').disabled = $('#wz-time').disabled = d.when !== 'at';
      var n = Object.keys(d.sel).length;
      var whenTxt = d.when === 'now' ? 'sekarang' : 'pada ' + fLong(zEpoch(d.date, d.time)) + ' pukul ' + d.time + ' ' + tz;
      $('#wz-sum').innerHTML = '<b>' + esc(sc.name) + '</b> akan dijalankan di <b>' + n + ' endpoint</b> ' + esc(whenTxt) + '.' +
        (d.params.text ? '<div style="margin-top:6px">Pesan: “' + esc(d.params.text) + '”</div>' : '') + (d.params.url ? '<div style="margin-top:6px">URL: ' + esc(d.params.url) + '</div>' : '');
    };
    $$('input, select', el).forEach(function (i) { i.addEventListener('input', upd); i.addEventListener('change', upd); });
    upd();
    self.renderFootOnly();
  },
  next: function () {
    var d = this.d;
    if (d.step === 1) {
      if (!d.action) { toast('Pilih salah satu skrip dulu.', true); return; }
      var sc = SCRIPT[d.action];
      if (sc.params) {
        for (var i = 0; i < sc.params.length; i++) {
          var v = String(d.params[sc.params[i].key] || '').trim();
          if (!v) { toast(sc.params[i].label + ' wajib diisi.', true); return; }
          if (sc.params[i].key === 'url' && !/^https?:\/\//i.test(v)) { toast('URL harus diawali http:// atau https://', true); return; }
        }
      }
    }
    if (d.step === 2 && !Object.keys(d.sel).length) { toast('Pilih minimal satu endpoint.', true); return; }
    d.step++;
    this.render();
  },
  prev: function () { this.d.step--; this.render(); },
  finish: function () {
    var d = this.d;
    var at = 0;
    if (d.when === 'at') {
      if (!d.date || !d.time) { toast('Isi tanggal dan jam.', true); return; }
      at = zEpoch(d.date, d.time);
      if (at < now() - 60000) { toast('Waktu yang dipilih sudah lewat.', true); return; }
    }
    var winMin = d.win * (d.unit === 'jam' ? 60 : 1);
    var btn = $('#wz-finish');
    btn.disabled = true;
    btn.innerHTML = '<span class="spin"></span> Mengirim…';
    var targets = Object.keys(d.sel);
    act('createJob', { action: d.action, params: d.params, targets: targets, runAt: at, windowMin: winMin },
      SCRIPT[d.action].name + (at ? ' dijadwalkan untuk ' : ' dikirim ke ') + targets.length + ' endpoint.').then(function (r) {
      closeLayer();
      go('job', { id: r.id });
    }, function () { btn.disabled = false; btn.textContent = 'Selesai'; });
  }
};

/* =============================== EVENT =============================== */
document.addEventListener('click', function (e) {
  var el = e.target.closest('[data-act]');
  if (!el) {
    var dm = $('.drop-menu'); if (dm && !e.target.closest('.drop')) dm.remove();
    return;
  }
  var a = el.getAttribute('data-act');
  var dmenu = $('.drop-menu'); if (dmenu && a !== 'org-menu' && !el.closest('.drop-menu')) dmenu.remove();
  var id = el.getAttribute('data-id');
  switch (a) {
    case 'go': {
      var p = {};
      if (el.hasAttribute('data-group')) p.group = el.getAttribute('data-group');
      go(el.getAttribute('data-v'), p);
      break;
    }
    case 'toggle-ep':
      if (S.view.name !== 'eps' || S.view.group) { S.epOpen = true; go('eps', {}); }
      else { S.epOpen = !S.epOpen; renderSide(); }
      break;
    case 'collapse': S.collapsed = !S.collapsed; lsSet('pl_collapsed', S.collapsed); $('#shell').classList.toggle('collapsed', S.collapsed); break;
    case 'burger': {
      var sh = $('#shell'); sh.classList.add('nav-open');
      var scr = document.createElement('div'); scr.className = 'nav-scrim';
      scr.onclick = function () { sh.classList.remove('nav-open'); scr.remove(); };
      sh.appendChild(scr);
      break;
    }
    case 'logout': call('logout').then(showLogin, showLogin); break;
    case 'connect': showConnect(); break;
    case 'close': closeLayer(); break;
    case 'wizard': Wizard.start({}); break;
    case 'wizard-sel': Wizard.start({ targets: Object.keys(S.sel) }); break;
    case 'wizard-script': Wizard.start({ action: el.getAttribute('data-a'), jump: true }); break;
    case 'wz-next': Wizard.next(); break;
    case 'wz-prev': Wizard.prev(); break;
    case 'wz-finish': Wizard.finish(); break;
    case 'wz-all': Wizard.epFiltered().forEach(function (x) { Wizard.d.sel[x.id] = 1; }); Wizard.refreshEps(); break;
    case 'wz-none': Wizard.d.sel = {}; Wizard.refreshEps(); break;
    case 'wz-on': Wizard.epFiltered().forEach(function (x) { if (x.online) Wizard.d.sel[x.id] = 1; else delete Wizard.d.sel[x.id]; }); Wizard.refreshEps(); break;
    case 'wz-off': Wizard.epFiltered().forEach(function (x) { if (!x.online) Wizard.d.sel[x.id] = 1; else delete Wizard.d.sel[x.id]; }); Wizard.refreshEps(); break;
    case 'quick': {
      var g = S.quickGroup;
      var act1 = el.getAttribute('data-a');
      var list = S.endpoints.filter(function (x) { return !g || x.group === g; });
      if (act1 === 'wol') list = list.filter(function (x) { return !x.online; });
      if (!list.length) { toast(act1 === 'wol' ? 'Semua komputer di target sudah menyala.' : 'Tidak ada endpoint di target ini.', true); break; }
      runQuick(act1, list.map(function (x) { return x.id; }), g || 'semua grup');
      break;
    }
    case 'sched-exam': {
      var L = VIEWS.layar.read && $('#ly-date') ? VIEWS.layar.read() : S.layar;
      if (!L.start || L.start < now()) { toast('Atur jam mulai sesi yang belum lewat dulu.', true); break; }
      var tg = S.endpoints.filter(function (x) { return !S.quickGroup || x.group === S.quickGroup; }).map(function (x) { return x.id; });
      Wizard.start({ action: 'run_exam', targets: tg, at: L.start, jump: true });
      break;
    }
    case 'row': {
      if (e.target.closest('button, input')) break;
      if (S.sel[id]) delete S.sel[id]; else S.sel[id] = 1;
      VIEWS.eps.update();
      break;
    }
    case 'pick': {
      if (el.checked) S.sel[id] = 1; else delete S.sel[id];
      VIEWS.eps.update();
      break;
    }
    case 'sel-clear': S.sel = {}; VIEWS.eps.update(); break;
    case 'sort': {
      var k = el.getAttribute('data-k');
      if (S.sort.key === k) S.sort.dir *= -1; else S.sort = { key: k, dir: 1 };
      go('eps', { group: S.view.group }, true);
      break;
    }
    case 'page': S.page += Number(el.getAttribute('data-d')); VIEWS.eps.update(); break;
    case 'sel-run': {
      var ids = Object.keys(S.sel);
      if (ids.length) runQuick(el.getAttribute('data-a'), ids, '');
      break;
    }
    case 'one-run': closeLayer(); runQuick(el.getAttribute('data-a'), [id], id); break;
    case 'ep-detail': epDetail(id); break;
    case 'save-comment':
      act('setComment', { id: id, comment: $('#ep-cm').value.trim() }, 'Keterangan disimpan.').then(refreshEndpoints);
      break;
    case 'org-menu': {
      var ex = $('.drop-menu');
      if (ex) { ex.remove(); break; }
      var n = Object.keys(S.sel).length;
      var m = document.createElement('div');
      m.className = 'drop-menu';
      m.innerHTML = '<button data-act="org-move"' + (n ? '' : ' disabled') + '>' + icon('folder', 'sm') + 'Pindahkan ke grup…</button>' +
        '<button data-act="org-comment"' + (n === 1 ? '' : ' disabled') + '>' + icon('edit', 'sm') + 'Ubah keterangan…</button>' +
        '<button data-act="org-delete" class="red"' + (n ? '' : ' disabled') + '>' + icon('trash', 'sm') + 'Hapus dari panel…</button>';
      el.parentNode.appendChild(m);
      break;
    }
    case 'org-move': {
      var ids2 = Object.keys(S.sel);
      openModal('<form id="mv"><div class="mh"><h3>Pindahkan ' + ids2.length + ' endpoint</h3><button type="button" class="x" data-act="close">' + icon('x') + '</button></div>' +
        '<div class="mb"><label class="f">Ke grup<select class="inp" id="mv-g">' + S.groups.map(function (g) { return '<option>' + esc(g) + '</option>'; }).join('') + '<option value="__new">+ Grup baru…</option></select></label>' +
        '<label class="f" id="mv-new-w" hidden>Nama grup baru<input class="inp" id="mv-new" maxlength="60" placeholder="Misal: Lab TJKT 1"></label></div>' +
        '<div class="mf"><span class="sp"></span><button type="button" class="btn ghost" data-act="close">Batal</button><button class="btn" type="submit">Pindahkan</button></div></form>');
      $('#mv-g').addEventListener('change', function () { $('#mv-new-w').hidden = this.value !== '__new'; });
      $('#mv').addEventListener('submit', function (ev) {
        ev.preventDefault();
        var grp = $('#mv-g').value === '__new' ? $('#mv-new').value.trim() : $('#mv-g').value;
        if (!grp) { toast('Isi nama grup.', true); return; }
        closeLayer();
        act('moveEndpoints', { ids: ids2, group: grp }, ids2.length + ' endpoint dipindahkan ke ' + grp + '.').then(function () {
          if (S.groups.indexOf(grp) < 0) S.groups.push(grp);
          S.sel = {};
          return refreshEndpoints();
        }).then(function () { renderSide(); VIEWS.eps.update(); });
      });
      break;
    }
    case 'org-comment': {
      var one = Object.keys(S.sel)[0];
      var ep0 = S.endpoints.filter(function (x) { return x.id === one; })[0];
      promptBox('Keterangan ' + one, 'Keterangan', ep0 ? ep0.comment : '', 'Simpan').then(function (v) {
        if (v == null) return;
        act('setComment', { id: one, comment: v }, 'Keterangan disimpan.').then(refreshEndpoints);
      });
      break;
    }
    case 'org-delete': {
      var ids3 = Object.keys(S.sel);
      confirmBox('Hapus ' + ids3.length + ' endpoint?', '<div>Endpoint akan dihapus dari daftar panel. Jika agennya masih terpasang dan komputer menyala, komputer akan muncul lagi di grup bawaan.</div><div class="muted">Untuk menghapus permanen, copot agennya (menu Pasang Agen).</div>', 'Hapus', true)
        .then(function (ok) {
          if (!ok) return;
          act('deleteEndpoints', { ids: ids3 }, ids3.length + ' endpoint dihapus.').then(function () { S.sel = {}; return refreshEndpoints(); }).then(function () { renderSide(); });
        });
      break;
    }
    case 'new-group':
      promptBox('Grup baru', 'Nama grup', '', 'Buat grup').then(function (v) {
        if (!v) return;
        act('createGroup', { name: v }, 'Grup ' + v + ' dibuat. Pindahkan endpoint lewat menu Atur Endpoint.').then(function (r) { S.groups = r.groups; go('eps', { group: v }); });
      });
      break;
    case 'group-settings': {
      var gname = S.view.group;
      if (gname === NEW_GROUP) { toast('Grup "' + NEW_GROUP + '" adalah grup bawaan dan tidak bisa diubah.', true); break; }
      openModal('<div class="mh"><h3>Pengaturan grup</h3><button class="x" data-act="close">' + icon('x') + '</button></div>' +
        '<div class="mb"><label class="f">Nama grup<input class="inp" id="gs-name" value="' + esc(gname) + '" maxlength="60"></label>' +
        '<div class="muted" style="font-size:13px">Grup ini berisi ' + epCount(gname) + ' endpoint. Jika dihapus, endpoint pindah ke grup "' + NEW_GROUP + '".</div></div>' +
        '<div class="mf"><button class="btn danger" id="gs-del">' + icon('trash', 'sm') + 'Hapus grup</button><span class="sp"></span><button class="btn ghost" data-act="close">Batal</button><button class="btn" id="gs-save">Simpan</button></div>');
      $('#gs-save').onclick = function () {
        var to = $('#gs-name').value.trim();
        if (!to || to === gname) { closeLayer(); return; }
        closeLayer();
        act('renameGroup', { from: gname, to: to }, 'Nama grup diganti.').then(function (r) { S.groups = r.groups; return refreshEndpoints(); }).then(function () { go('eps', { group: to }); });
      };
      $('#gs-del').onclick = function () {
        closeLayer();
        act('deleteGroup', { name: gname }, 'Grup dihapus.').then(function (r) { S.groups = r.groups; return refreshEndpoints(); }).then(function () { go('eps', {}); });
      };
      break;
    }
    case 'open-job': go('job', { id: id }); break;
    case 'cancel-job':
      confirmBox('Batalkan otomasi?', '<div>Endpoint yang belum menjalankan skrip ini tidak akan menjalankannya.</div>', 'Batalkan otomasi', true).then(function (ok) {
        if (!ok) return;
        act('cancelJob', { id: S.view.id }, 'Otomasi dibatalkan.').then(function () { VIEWS.job._again = true; VIEWS.job.poll(); });
      });
      break;
    case 'retry-job': {
      var j = S.job.job;
      act('createJob', { action: j.action, params: j.params, targets: VIEWS.job._failed, windowMin: (SCRIPT[j.action] || {}).win || 60 },
        'Diulang untuk ' + VIEWS.job._failed.length + ' endpoint.').then(function (r) { go('job', { id: r.id }); });
      break;
    }
    case 'clear-history':
      confirmBox('Hapus semua riwayat?', '<div>Semua riwayat otomasi dan perintah yang belum dijalankan akan dihapus. Data endpoint tidak terhapus.</div>', 'Hapus riwayat', true).then(function (ok) {
        if (!ok) return;
        act('clearHistory', {}, 'Riwayat dihapus.').then(function () { VIEWS.jobs.poll(); });
      });
      break;
    case 'rand-token': {
      var chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ';
      var tk = '';
      for (var i = 0; i < 6; i++) tk += chars[Math.floor(Math.random() * chars.length)];
      $('#ly-token').value = tk;
      VIEWS.layar.tick();
      break;
    }
    case 'copy': copyText($(el.getAttribute('data-src')).textContent); break;
    case 'dl-bat': {
      var bt = VIEWS.agent._bat;
      if (!bt) break;
      downloadText(bt.text, bt.name);
      toast(bt.name + ' diunduh. Cek folder Unduhan (Downloads).');
      break;
    }
    case 'regen-key':
      confirmBox('Ganti kunci agen?', '<div>Semua agen yang sudah terpasang <b>berhenti terhubung</b> dan harus dipasang ulang dengan perintah baru. Lakukan hanya jika kunci bocor.</div>', 'Ganti kunci', true).then(function (ok) {
        if (!ok) return;
        act('regenKey', {}, 'Kunci agen diganti. Pasang ulang agen di semua komputer.').then(function (r) { S.key = r.key; S.installUrl = r.installUrl; go('agent'); });
      });
      break;
    case 'show-agent': {
      var box = $('#ag-code');
      if (!box.hidden) { box.hidden = true; el.textContent = 'Tampilkan kode'; break; }
      box.hidden = false; el.textContent = 'Sembunyikan';
      box.innerHTML = '<div class="loading"><span class="spin"></span></div>';
      call('agentCode').then(function (r) { box.innerHTML = '<pre class="src">' + esc(r.code) + '</pre>'; });
      break;
    }
    case 'view-file': {
      var fn = el.getAttribute('data-f');
      var w = $('[data-view="' + fn + '"]');
      if (!w.hidden) { w.hidden = true; el.textContent = 'Lihat'; break; }
      w.hidden = false; el.textContent = 'Tutup';
      w.innerHTML = FILE_CACHE[fn] ? '<pre class="src">' + esc(FILE_CACHE[fn]) + '</pre>' : '<div class="muted">Masih memuat…</div>';
      break;
    }
    case 'copy-file': {
      var f2 = el.getAttribute('data-f');
      if (FILE_CACHE[f2]) copyText(FILE_CACHE[f2], f2 + ' disalin (' + FILE_CACHE[f2].split('\n').length + ' baris). Tempel di Apps Script.');
      break;
    }
  }
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape') {
    var dm = $('.drop-menu'); if (dm) { dm.remove(); return; }
    if ($('#layer').innerHTML) closeLayer();
  }
});

/* =============================== MULAI =============================== */
if (QS.get('demo') === '1') startDemo();
else if (API) startLive();
else showConnect();
})();
</script>
</body>
</html>
